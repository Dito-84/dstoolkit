[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-science-toolkit"
version = "0.1.0"
description = "Quick exploratory data analysis helpers: distributions, summary tables and line fits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "matplotlib>=3.10",
    "scipy>=1.10",
]

[project.optional-dependencies]
notebooks = ["jupyter", "scikit-learn", "numpy"]
dev = ["pytest", "nbconvert", "nbclient", "ipykernel", "scikit-learn"]

[tool.setuptools]
py-modules = ["toolkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
