[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dstoolkit"
dynamic = ["version"]
description = "Data cleaning and exploratory analysis helpers for pandas: duplicates, missing values, outliers, encoding, scaling, distributions and line fits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rolando Rodriguez Jr." }]
requires-python = ">=3.10"
keywords = ["data cleaning", "preprocessing", "eda", "pandas", "data science"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.10",
    "scipy>=1.10",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.3"]   # for the transformers and fill_missing(numeric="knn")
notebooks = ["jupyter"]
dev = ["scikit-learn>=1.3", "pytest", "pytest-cov", "mypy", "pandas-stubs", "ruff", "nbconvert", "nbclient", "ipykernel"]

[project.urls]
Repository = "https://github.com/Dito-84/dstoolkit"
Changelog = "https://github.com/Dito-84/dstoolkit/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "dstoolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dstoolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["dstoolkit"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks/learning"]   # tutorial notebooks, kept as they were written

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, likely bugs (bugbear), modern syntax for 3.10+
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/dstoolkit/__init__.py" = ["F401"]   # re-exports; __all__ is built from each module's __all__

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
