[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dstoolkit"
dynamic = ["version"]
description = "Data cleaning and exploratory analysis helpers for pandas: duplicates, missing values, outliers, encoding, scaling, distributions and line fits"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rolando Rodriguez Jr." }]
requires-python = ">=3.10"
keywords = ["data cleaning", "preprocessing", "eda", "pandas", "data science"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.10",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
notebooks = ["jupyter"]
dev = ["pytest", "mypy", "pandas-stubs", "nbconvert", "nbclient", "ipykernel"]

[project.urls]
Repository = "https://github.com/Dito-84/Data_Science_Toolkit"
Changelog = "https://github.com/Dito-84/Data_Science_Toolkit/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "dstoolkit.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dstoolkit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src"]
ignore_missing_imports = true
