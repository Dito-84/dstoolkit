name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Type check
        run: mypy

      - name: Run tests (fails below 95% coverage)
        run: pytest -v --cov --cov-report=term-missing

      - name: Run every notebook top to bottom
        env:
          MPLBACKEND: Agg
        run: |
          python -m ipykernel install --user --name python3
          for nb in notebooks/*.ipynb notebooks/learning/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
            echo "::endgroup::"
          done

  minimum-versions:
    # The oldest pandas, NumPy, matplotlib, SciPy and scikit-learn allowed by pyproject.toml
    name: test (minimum versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install the lowest allowed versions
        run: |
          pip install uv
          uv pip install --system --resolution lowest-direct -e ".[sklearn]"
          uv pip install --system pytest
          python -c "import pandas, numpy, matplotlib, scipy, sklearn; print('pandas', pandas.__version__, '| numpy', numpy.__version__, '| matplotlib', matplotlib.__version__, '| scipy', scipy.__version__, '| scikit-learn', sklearn.__version__)"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest -v

  browser-app:
    # Loads the drag-and-drop app in a real browser with Python from the Pyodide CDN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install -e . pytest playwright openpyxl
          python -m playwright install --with-deps chromium

      - name: App logic tests
        run: pytest -v app/tests/test_app_core.py

      - name: Build the app
        run: python app/build.py

      - name: Browser tests
        env:
          BROWSER_TESTS: "1"
        run: |
          pytest -v --tb=short app/tests/test_browser.py --junitxml=browser.xml || {
            python app/tests/ci_annotations.py browser.xml
            exit 1
          }

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: _screenshots/
          if-no-files-found: ignore
