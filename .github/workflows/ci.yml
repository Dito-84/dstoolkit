name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Type check
        run: mypy

      - name: Run tests
        run: pytest -v

      - name: Run every notebook top to bottom
        env:
          MPLBACKEND: Agg
        run: |
          python -m ipykernel install --user --name python3
          for nb in notebooks/*.ipynb notebooks/learning/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --stdout "$nb" > /dev/null
            echo "::endgroup::"
          done

  browser-app:
    # Loads the drag-and-drop app in a real browser with Python from the Pyodide CDN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          pip install -e . pytest playwright openpyxl
          python -m playwright install --with-deps chromium

      - name: App logic tests
        run: pytest -v app/tests/test_app_core.py

      - name: Build the app
        run: python app/build.py

      - name: Browser tests
        env:
          BROWSER_TESTS: "1"
        run: pytest -v app/tests/test_browser.py

      - name: Save screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-screenshots
          path: _screenshots/
          if-no-files-found: ignore
